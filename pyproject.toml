[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "35inch-qt"
version = "0.1.0"
description = "Interface Qt para o display USB de 3.5 polegadas (UsbMonitor 1a86:5722) no Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6-Essentials>=6.5",
    "pyserial>=3.5",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
usbmonitor-qt = "usbmonitor_qt.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
usbmonitor_qt = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
